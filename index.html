
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYCO AI - Personal Assistant</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:Arial,sans-serif;
  background:#212121;
  color:#f5f5f5;
  height:100vh;
  overflow:hidden;
}

.app { display:flex; height:100vh; }

.sidebar {
  width:265px;
  background:#171717;
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  border-right:1px solid #303030;
}

.logo {
  font-size:27px;
  font-weight:bold;
  letter-spacing:2px;
  padding:10px;
  color:#c4a6ff;
}

.new-chat {
  margin:20px 0;
  padding:13px;
  border:1px solid #555;
  border-radius:9px;
  color:white;
  background:transparent;
  cursor:pointer;
  text-align:left;
  font-size:15px;
}

.new-chat:hover,.history-item:hover { background:#303030; }

.history-title {
  color:#999;
  font-size:12px;
  margin:15px 10px;
}

.history { overflow-y:auto; flex:1; }

.history-item {
  padding:11px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile {
  border-top:1px solid #444;
  padding:15px 8px;
  font-size:13px;
  color:#ccc;
}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar {
  height:62px;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.topbar h2 { font-size:19px; font-weight:500; }

select {
  background:#303030;
  color:white;
  border:1px solid #555;
  padding:9px;
  border-radius:8px;
}

.chat-area {
  flex:1;
  overflow-y:auto;
  padding:30px 16px 150px;
}

.welcome {
  text-align:center;
  margin:13vh auto 30px;
  max-width:650px;
}

.avatar {
  width:85px;
  height:85px;
  margin:auto auto 20px;
  border-radius:50%;
  background:linear-gradient(135deg,#7447db,#d18bff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  box-shadow:0 0 35px #7546bd55;
}

.welcome h1 { font-size:32px; margin-bottom:12px; }
.welcome p { color:#aaa; line-height:1.6; }

.suggestions {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  max-width:650px;
  margin:30px auto;
}

.suggestion {
  border:1px solid #444;
  padding:17px;
  border-radius:12px;
  background:#292929;
  cursor:pointer;
  color:white;
  text-align:left;
}

.suggestion:hover { background:#383838; }

.messages { max-width:820px; margin:auto; }

.message {
  display:flex;
  gap:14px;
  margin:25px 0;
  line-height:1.7;
}

.message.user { justify-content:flex-end; }

.message.user .bubble {
  background:#343434;
  padding:13px 17px;
  border-radius:18px;
  max-width:80%;
}

.message.ai .bubble {
  max-width:90%;
  overflow-wrap:anywhere;
}

.message-icon {
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:50%;
  background:#7551bd;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bubble pre {
  white-space:pre-wrap;
  overflow-x:auto;
  background:#111;
  padding:14px;
  border-radius:9px;
  margin:12px 0;
}

.bubble code { background:#333; padding:2px 5px; border-radius:4px; }

.typing { color:#aaa; padding:12px; font-size:14px; }

.input-section {
  position:relative;
  padding:15px 20px 12px;
  background:linear-gradient(transparent,#212121 15%);
}

.input-box {
  max-width:820px;
  margin:auto;
  border:1px solid #555;
  border-radius:17px;
  background:#303030;
  padding:12px;
  display:flex;
  align-items:flex-end;
  gap:10px;
}

textarea {
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:white;
  font-size:16px;
  resize:none;
  max-height:160px;
  min-height:28px;
  padding:5px;
  font-family:inherit;
}

.action {
  border:none;
  background:transparent;
  color:white;
  font-size:21px;
  cursor:pointer;
  padding:5px;
}

.send {
  background:#a77aff;
  color:#171717;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:19px;
}

.send:disabled { opacity:.5; cursor:not-allowed; }

.footer {
  text-align:center;
  color:#888;
  font-size:11px;
  padding:8px;
}

@media(max-width:700px) {
  .sidebar { display:none; }
  .suggestions { grid-template-columns:1fr; }
  .welcome h1 { font-size:26px; }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">BYCO ✦</div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <div class="history-title">RECENT CHATS</div>
    <div class="history" id="history"></div>

    <div class="profile">
      <strong>BYCO AI</strong><br>
      Personal AI Assistant
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <h2>BYCO AI</h2>

      <select id="language">
        <option value="same">Auto Language</option>
        <option value="English">Indian English</option>
        <option value="Roman Urdu">Roman Urdu</option>
        <option value="Urdu">Urdu</option>
        <option value="Hindi">Hindi</option>
        <option value="Hinglish">Hinglish</option>
      </select>
    </header>

    <section class="chat-area" id="chatArea">

      <div class="welcome" id="welcome">
        <div class="avatar">✦</div>

        <h1>How can I help you today?</h1>

        <p>
          I am BYCO, your personal AI assistant.
          Ask me anything about coding, education,
          science, technology and more.
        </p>

        <div class="suggestions">

          <button class="suggestion"
          onclick="useSuggestion('Explain Artificial Intelligence simply')">
            🧠 Explain Artificial Intelligence
          </button>

          <button class="suggestion"
          onclick="useSuggestion('Write a Python calculator program')">
            💻 Write a Python Program
          </button>

          <button class="suggestion"
          onclick="useSuggestion('Help me with my science studies')">
            📚 Help with Studies
          </button>

          <button class="suggestion"
          onclick="useSuggestion('Give me a unique technology project idea')">
            🚀 Project Ideas
          </button>

        </div>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <section class="input-section">
      <div class="input-box">

        <textarea id="messageInput"
          placeholder="Message BYCO..."
          rows="1"></textarea>

        <button class="action" onclick="startVoice()" title="Voice input">🎤</button>

        <button class="action" onclick="toggleSpeech()" title="Voice output">🔊</button>

        <button class="action send" id="sendButton" onclick="sendMessage()">↑</button>

      </div>

      <div class="footer">
        BYCO can make mistakes. Check important information.
      </div>
    </section>

  </main>
</div>

<script>
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const chatArea = document.getElementById("chatArea");
const welcome = document.getElementById("welcome");
const sendButton = document.getElementById("sendButton");
const historyBox = document.getElementById("history");
const languageSelect = document.getElementById("language");

let chatHistory = [];
let conversations = [];
let currentChatId = Date.now();
let speechEnabled = true;
let busy = false;

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function formatText(text) {
  let safe = escapeHTML(text);

  safe = safe.replace(/```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>");

  safe = safe.replace(/`([^`]+)`/g,
    "<code>$1</code>");

  safe = safe.replace(/\*\*(.*?)\*\*/g,
    "<strong>$1</strong>");

  safe = safe.replace(/\n/g, "<br>");

  return safe;
}

function addMessage(role,text) {
  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message " + role;

  if (role === "user") {
    message.innerHTML =
      '<div class="bubble">' + formatText(text) + '</div>';
  } else {
    message.innerHTML =
      '<div class="message-icon">✦</div>' +
      '<div class="bubble">' + formatText(text) + '</div>';
  }

  messages.appendChild(message);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function updateHistory() {
  historyBox.innerHTML = "";

  conversations.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item";
    item.textContent = chat.title;
    item.onclick = () => openChat(chat.id);
    historyBox.appendChild(item);
  });
}

function saveCurrentChat() {
  if (chatHistory.length === 0) return;

  const existing = conversations.find(
    chat => chat.id === currentChatId
  );

  const chatData = {
    id:currentChatId,
    title:chatHistory[0].text.slice(0,35),
    history:[...chatHistory]
  };

  if (existing) Object.assign(existing,chatData);
  else conversations.unshift(chatData);

  updateHistory();
}

function newChat() {
  currentChatId = Date.now();
  chatHistory = [];
  messages.innerHTML = "";
  welcome.style.display = "block";
  input.value = "";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

function openChat(id) {
  const chat = conversations.find(c => c.id === id);
  if (!chat) return;

  currentChatId = chat.id;
  chatHistory = [...chat.history];
  messages.innerHTML = "";
  welcome.style.display = "none";

  chatHistory.forEach(item => {
    addMessage(
      item.role === "user" ? "user" : "ai",
      item.text
    );
  });
}

function useSuggestion(text) {
  input.value = text;
  sendMessage();
}

input.addEventListener("keydown",event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input",() => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,160) + "px";
});

async function sendMessage() {
  const text = input.value.trim();

  if (!text || busy) return;

  busy = true;
  sendButton.disabled = true;

  input.value = "";
  input.style.height = "28px";

  addMessage("user",text);

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "BYCO is thinking...";
  messages.appendChild(typing);

  chatArea.scrollTop = chatArea.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:text,
        language:languageSelect.value,
        history:chatHistory
      })
    });

    const data = await response.json();
    typing.remove();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    if (!data.reply) {
      throw new Error("BYCO returned an empty response.");
    }

    addMessage("ai",data.reply);

    chatHistory.push(
      {role:"user",text:text},
      {role:"model",text:data.reply}
    );

    chatHistory = chatHistory.slice(-20);
    saveCurrentChat();

    if (speechEnabled) speak(data.reply);

  } catch(error) {
    typing.remove();
    addMessage("ai","Sorry! " + error.message);

  } finally {
    busy = false;
    sendButton.disabled = false;
    input.focus();
  }
}

/* VOICE LANGUAGE DETECTION */

function detectSpeechLanguage(text) {
  const selected = languageSelect.value;

  if (selected === "Hindi") return "hi-IN";
  if (selected === "English") return "en-IN";
  if (selected === "Roman Urdu" || selected === "Hinglish") return "hi-IN";
  if (selected === "Urdu") return "ur-PK";

  if (/[\u0900-\u097F]/.test(text)) return "hi-IN";
  if (/[\u0600-\u06FF]/.test(text)) return "ur-PK";

  if (/\b(ka|ki|hai|hain|ho|aap|mera|meri|kya|kyun|nahi|nahin|mujhe|tum|acha|theek|karna|karo|chahiye)\b/i.test(text)) {
    return "hi-IN";
  }

  return "en-IN";
}

/* PREFER A FEMALE-SOUNDING AVAILABLE VOICE */

function getPreferredVoice(lang) {
  const voices = window.speechSynthesis.getVoices();

  const matching = voices.filter(voice =>
    voice.lang.toLowerCase() === lang.toLowerCase()
  );

  const female = matching.find(voice =>
    /female|heera|kalpana|zira|priya|lekha/i.test(voice.name)
  );

  return female || matching[0] || null;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const lang = detectSpeechLanguage(text);
  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = lang;
  speech.rate = 0.95;
  speech.pitch = 1.12;
  speech.volume = 1;

  let voice = getPreferredVoice(lang);

  // Roman Urdu can use an Indian Hindi voice if Urdu voice is unavailable.
  if (!voice && lang === "ur-PK") {
    voice = getPreferredVoice("hi-IN");
    if (voice) speech.lang = "hi-IN";
  }

  if (voice) speech.voice = voice;

  window.speechSynthesis.speak(speech);
}

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

function toggleSpeech() {
  speechEnabled = !speechEnabled;

  if (!speechEnabled && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  alert(speechEnabled
    ? "Voice output enabled."
    : "Voice output disabled."
  );
}

/* VOICE INPUT */

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  const selected = languageSelect.value;

  if (selected === "Hindi") recognition.lang = "hi-IN";
  else if (selected === "Urdu" || selected === "Roman Urdu") recognition.lang = "hi-IN";
  else recognition.lang = "en-IN";

  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    alert("Voice input could not start. Please try again.");
  };

  recognition.start();
}
</script>

</body>
</html>
